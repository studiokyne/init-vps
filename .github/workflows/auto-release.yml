name: Auto Release

on:
  push:
    branches:
      - main

jobs:
  # Les contrôles vivent dans lint.yml et sont RÉUTILISÉS ici, jamais recopiés.
  # La version dupliquée qui existait avant ancrait son motif awk sur `^cat`
  # alors que les deux heredocs sont indentés dans des fonctions : l'extraction
  # renvoyait 0 ligne et `bash -n` sur un fichier vide réussit. Le contrôle des
  # heredocs ne testait donc rien sur le chemin qui publie les releases.
  lint:
    name: ShellCheck + syntax
    uses: ./.github/workflows/lint.yml

  auto-release:
    name: Version + release
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        run: |
          DATE=$(date -u +%Y.%m.%d)
          LAST_N=$(git tag -l "v${DATE}.*" | grep -oP '\d+$' | sort -n | tail -1)
          N=$(( ${LAST_N:-0} + 1 ))
          echo "tag=v${DATE}.${N}" >> "$GITHUB_OUTPUT"
          echo "version=${DATE}.${N}" >> "$GITHUB_OUTPUT"

      - name: Build versioned script
        run: |
          # `0,/re/s//…/` = première occurrence SEULEMENT. `^SCRIPT_VERSION=`
          # matche aussi la ligne du heredoc de step_save_state (config.env),
          # qu'on ne veut pas figer : elle doit rester ${SCRIPT_VERSION}.
          sed "0,/^SCRIPT_VERSION=.*/s//SCRIPT_VERSION=\"${{ steps.version.outputs.version }}\"/" \
            init-vps.sh > /tmp/init-vps.sh
          chmod +x /tmp/init-vps.sh
          bash -n /tmp/init-vps.sh
          # Garde-fou : le sed doit avoir réellement substitué la version, sinon
          # on publierait un script marqué 0.0.0-dev sans que rien ne le signale.
          grep -q "^SCRIPT_VERSION=\"${{ steps.version.outputs.version }}\"$" /tmp/init-vps.sh \
            || { echo "::error::SCRIPT_VERSION non substituée — le motif sed ne matche plus init-vps.sh"; exit 1; }

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "init-vps ${{ steps.version.outputs.version }}"
          generate_release_notes: true
          files: /tmp/init-vps.sh
